<title>કાર્યક્રમ</title><meta name="claude:viewport-fit-sides" content="cover"><style id="css">
/* Layout: one narrow column, day-at-a-time program with a colour-block time rail on each event. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --fg:#16202E; --muted:#5B6678; --line:#DDE2EA; --accent:#C2410C; --soft:#E9EDF3;

  --c-vastu:#FFDC3C; --c-sabha:#E8589A; --c-flight:#2BA3DF; --c-car:#3F67D6; --c-other:#2F6F6B;
  --s-g:#9F1239; --s-hs:#3730A3; --s-mm:#0F766E; --s-hp:#4D7C0F; --s-np:#B45309; --s-ap:#BE185D;
  --now:#0B7A43;
  --display:"Bricolage Grotesque","Noto Sans Gujarati","Trebuchet MS",system-ui,sans-serif; --body:"Figtree","Noto Sans Gujarati",system-ui,-apple-system,"Segoe UI",sans-serif;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
*{box-sizing:border-box}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.1} h2{font-size:20px} h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.head{display:flex;flex-direction:column;gap:4px}
.sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px}
.tab{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav .date{flex:1;min-width:150px;text-align:center;font-family:var(--display);font-size:19px;font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.danger{color:#C62828;border-color:#C62828}
.btn[disabled]{opacity:.55;cursor:default}

.place .where{font-family:var(--display);font-size:24px;line-height:1.1;font-weight:700}

@keyframes aflick{0%{transform:scale(1,1) skewX(-4deg)}35%{transform:scale(.92,1.08) skewX(3deg)}70%{transform:scale(1.05,.95) skewX(-2deg)}100%{transform:scale(.96,1.1) skewX(5deg)}}
@keyframes acore{from{opacity:.8;transform:scaleY(.9)}to{opacity:1;transform:scaleY(1.1)}}
.lamp .glow{position:absolute;left:-10px;top:-6px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,rgba(255,170,40,.55),rgba(255,140,0,0) 70%);animation:aglow .6s ease-in-out infinite alternate}
@keyframes aglow{from{opacity:.65}to{opacity:1}}
.fx{position:absolute;pointer-events:none;font-style:normal;font-size:18px;line-height:1;z-index:2;filter:drop-shadow(0 0 4px rgba(255,255,255,.8))}
.fx-pothiyatra{font-size:20px;animation:flame 5s ease-in-out infinite}

@keyframes flame{0%{transform:translate(0,0) scale(1) rotate(-6deg)}20%{transform:translate(28px,-14px) scale(1.2) rotate(6deg)}40%{transform:translate(52px,6px) scale(.9) rotate(-5deg)}60%{transform:translate(18px,16px) scale(1.15) rotate(7deg)}80%{transform:translate(-26px,-6px) scale(1) rotate(-7deg)}100%{transform:translate(0,0) scale(1) rotate(-6deg)}}
.fx-pravachan{font-size:24px;animation:mic 1.1s ease-in-out infinite}
.fx-pravachan.f1{right:12%;top:46%}.fx-pravachan.f2{right:30%;top:14%;font-size:15px;animation-delay:-.5s;opacity:.8}
@keyframes mic{0%,100%{transform:scale(1) rotate(-8deg)}50%{transform:scale(1.28) rotate(8deg)}}
.fx-pravachan.f1::before,.fx-pravachan.f1::after{content:'';position:absolute;left:50%;top:50%;width:100%;height:100%;border:2px solid rgba(220,40,40,.65);border-radius:50%;transform:translate(-50%,-50%) scale(1);animation:ring 1.4s ease-out infinite}
.fx-pravachan.f1::after{animation-delay:.7s}
@keyframes ring{to{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
.fx-flight{font-size:22px;top:25%;animation:fly 5s linear infinite}
.fx-flight.f2{top:62%;font-size:15px;animation-delay:-2.5s;animation-duration:7s;opacity:.85}
@keyframes fly{from{left:-8%;transform:translateY(8px) rotate(-8deg)}50%{transform:translateY(-8px) rotate(-8deg)}to{left:104%;transform:translateY(8px) rotate(-8deg)}}
.fx-sabha{top:-10%;animation:petal 4.5s linear infinite}
.fx-sabha.f1{left:12%;animation-delay:0s}.fx-sabha.f2{left:24%;animation-delay:-1.2s;font-size:14px}.fx-sabha.f3{left:38%;animation-delay:-2.6s}.fx-sabha.f4{left:50%;animation-delay:-.7s;font-size:13px}.fx-sabha.f5{left:62%;animation-delay:-3.4s}.fx-sabha.f6{left:72%;animation-delay:-1.9s;font-size:15px}.fx-sabha.f7{left:82%;animation-delay:-4s}.fx-sabha.f8{left:92%;animation-delay:-2.2s;font-size:13px}.fx-sabha.f9{left:46%;animation-delay:-3.8s;font-size:16px}
@keyframes petal{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}50%{transform:translate(14px,45px) rotate(180deg)}100%{transform:translate(-10px,110px) rotate(360deg);opacity:0}}
.fx-katha{font-size:24px;animation:book 2.4s ease-in-out infinite}
.fx-katha.f1{right:10%;top:42%}.fx-katha.f2{right:34%;top:12%;font-size:15px;animation-delay:-1.2s;opacity:.8}
@keyframes book{0%,100%{transform:translateY(0) rotateY(0)}25%{transform:translateY(-5px) rotateY(40deg)}50%{transform:translateY(0) rotateY(0) scale(1.12)}75%{transform:translateY(-5px) rotateY(-40deg)}}
.spark{position:absolute;width:7px;height:7px;pointer-events:none;background:#ffd84a;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;animation:twinkle 2.4s ease-in-out infinite;filter:drop-shadow(0 0 3px #ffe27a)}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.3) rotate(90deg)}}
.spark.s1{left:18%;top:30%;animation-delay:0.0s}.spark.s2{left:30%;top:70%;animation-delay:0.4s}.spark.s3{left:42%;top:22%;animation-delay:0.7s}.spark.s4{left:55%;top:62%;animation-delay:1.1s}.spark.s5{left:66%;top:30%;animation-delay:1.5s}.spark.s6{left:78%;top:72%;animation-delay:1.9s}.spark.s7{left:88%;top:26%;animation-delay:2.2s}.spark.s8{left:24%;top:50%;animation-delay:0.2s}.spark.s9{left:48%;top:45%;animation-delay:0.6s}.spark.s10{left:72%;top:50%;animation-delay:0.9s}.spark.s11{left:36%;top:82%;animation-delay:1.3s}.spark.s12{left:84%;top:48%;animation-delay:1.7s}

/* Swaminarayan devotional theme */
:root{ color-scheme:only light;
  --bg:#fff8eb; --surface:#fffdf8; --fg:#3f2414; --muted:#80664f; --line:#ead7b5;
  --accent:#b85b16; --soft:#f7e8ca; --now:#247447;
  --c-parayan:#C62828; --c-katha:#9b3568; --c-patotsav:#9a6a12; --c-pothiyatra:#D4A017;
  --c-padramani:#F28C28; --c-vastu:#FFDC3C; --c-sabha:#E8589A; --c-flight:#2BA3DF;
  --c-car:#3F67D6; --c-other:#2F6F6B; --c-pravachan:#E57373;
}
body{
 background:
   radial-gradient(ellipse at top, rgba(255,221,151,.28), transparent 42%),
   var(--bg);
}

.vsh .form{width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;max-height:86vh;overflow:auto;padding-bottom:22px}
.vsh .chips{display:flex;gap:6px;flex-wrap:wrap}
.vr{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;border:1px solid var(--line,#ecd9b0);border-radius:14px;background:var(--surface,#fff);padding:9px 11px;margin:0 0 8px;cursor:pointer}
.vr.me{border:2px solid #c8661b;background:rgba(232,163,61,.14)}
.vr.now{box-shadow:0 0 0 3px rgba(232,163,61,.4)}
.vr .vd{text-align:center;line-height:1.1}.vr .vd b{font-size:20px;display:block}.vr .vd span{font-size:10.5px;opacity:.75;text-transform:uppercase}
.vr .vn{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vr .vc{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:99px;background:#c8661b;color:#fff;font-size:11px;font-weight:700}
